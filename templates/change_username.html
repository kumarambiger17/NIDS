<!DOCTYPE html>
<html>
<head>

<title>NIDS</title>

<style>

body{
background:#101820;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{

background:#162536;

padding:35px;

width:400px;

border-radius:10px;

color:white;

}

input{

width:100%;

padding:12px;

margin:12px 0;

}

button{

width:100%;

padding:12px;

background:#ff9800;

border:none;

font-size:18px;

cursor:pointer;

}

.error{

color:rgb(0, 17, 255);

font-weight:bold;

}

.success{

color:#00ff66;

font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h2>👤 Change Username</h2>

<form method="POST">

<input
type="text"
name="old_username"
placeholder="Old Username"
required>

<input
type="text"
name="new_username"
placeholder="New Username"
required>

{% if error %}
<p class="error">{{error}}</p>
{% endif %}

{% if success %}
<p class="success">{{success}}</p>
{% endif %}

<button>

Update Username

</button>

</form>

</div>

</body>
</html>
