<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NIDS Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#101820;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{

            width:380px;

            background:#162536;

            padding:40px;

            border-radius:12px;

            box-shadow:0 0 20px rgba(0,212,255,.3);

            text-align:center;

        }

        h1{

            color:#00d4ff;

            margin-bottom:30px;

        }

        input{

            width:100%;

            padding:12px;

            margin:12px 0;

            border:none;

            border-radius:6px;

            font-size:16px;

        }

        .login-btn{

            width:100%;

            padding:12px;

            background:#00d4ff;

            color:#000;

            border:none;

            border-radius:6px;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }

        .login-btn:hover{

            background:#00a8cc;

        }

        .register-btn{

            width:100%;

            padding:12px;

            margin-top:15px;

            background:#28a745;

            color:white;

            border:none;

            border-radius:6px;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }

        .register-btn:hover{

            background:#218838;

        }

        .footer{

            margin-top:20px;

            color:#cccccc;

            font-size:14px;

        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🛡 AI NIDS</h1>

    <form method="POST" action="/login">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>
            {% if error %}
<p style="color:rgb(0, 17, 255);text-align:center;font-weight:bold;">
    {{ error }}
</p>
{% endif %}

{% if success %}
<p style="color:#22c55e;text-align:center;font-weight:bold;">
    {{ success }}
</p>
{% endif %}

<p style="margin-top:8px;">
    <a href="{{ url_for('forgot_password') }}" style="color:#38bdf8;text-decoration:none;font-size:14px;">
        Forgot Password?
    </a>
</p>

        <button type="submit" class="login-btn">
            Login
        </button>

        <button
            type="button"
            class="register-btn"
            onclick="window.location.href='/register'">
            Register
        </button>

    </form>
  
    <div class="footer">

        <p>Network Intrusion Detection System</p>

    </div>

</div>

</body>
</html>
