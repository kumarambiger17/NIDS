<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI NIDS Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#101820;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.register-box{
    width:420px;
    background:#162536;
    padding:35px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,212,255,.3);
}

h1{
    color:#00d4ff;
    text-align:center;
    margin-bottom:25px;
}

input[type=text],
input[type=email],
input[type=password]{

    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
    font-size:16px;

}

button{

    width:100%;
    padding:12px;
    margin-top:15px;
    background:#00d4ff;
    color:black;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;

}

button:hover{

    background:#00a8cc;

}

.error{

    color:red;
    margin-top:10px;
    font-size:15px;
    text-align:center;

}

.footer{

    margin-top:20px;
    text-align:center;
    color:white;

}

.footer a{

    color:#00d4ff;
    text-decoration:none;

}

.show{

    display:flex;
    align-items:center;
    color:white;
    margin-top:10px;

}

.show input{

    width:auto;
    margin-right:10px;

}

</style>

</head>
<body>
<div class="register-box">

<h1>🛡 AI NIDS Register</h1>

<form method="POST" action="/register" onsubmit="return validateForm();">

<input
type="text"
id="fullname"
name="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
name="email"
placeholder="Email Address"
required>

<input
type="text"
id="phone"
name="phone"
placeholder="PHONE NUMBER"
required>

<input
type="text"
id="username"
name="username"
placeholder="Username"
required>

<input
type="password"
id="password"
name="password"
placeholder="Password"
required>

<input
type="password"
id="confirm_password"
name="confirm_password"
placeholder="Confirm Password"
required>

<div class="show">

<input
type="checkbox"
id="show"
onclick="showPassword()">

<label for="show">
Show Password
</label>

</div>

<div id="error" class="error"></div>

<button type="submit">
Register
</button>
{% if error %}
<p style="color:rgb(0, 17, 255);text-align:center;font-weight:bold;">
    {{ error }}
</p>
{% endif %}

</form>

<div class="footer">

Already have an account?

<a href="/">
Login
</a>

</div>

</div>
<script>

function showPassword(){

let p=document.getElementById("password");
let c=document.getElementById("confirm_password");

if(p.type==="password"){

    p.type="text";
    c.type="text";

}
else{

    p.type="password";
    c.type="password";

}

}

function validateForm(){

let fullname=document.getElementById("fullname").value.trim();

let email=document.getElementById("email").value.trim();

let phone=document.getElementById("phone").value.trim();

let username=document.getElementById("username").value.trim();

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirm_password").value;

let error=document.getElementById("error");

error.innerHTML="";

let nameRegex=/^[A-Za-z ]+$/;

let emailRegex=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

let phoneRegex=/^[6-9][0-9]{9}$/;

if(!nameRegex.test(fullname)){

    error.innerHTML="Enter a valid Full Name.";
    return false;

}

if(!emailRegex.test(email)){

    error.innerHTML="Enter a valid Email Address.";
    return false;

}

if(!phoneRegex.test(phone)){

    error.innerHTML="Enter a valid 10-digit Phone Number.";
    return false;

}

if(username.length<4){

    error.innerHTML="Username must contain at least 4 characters.";
    return false;

}

if(password.length<8){

    error.innerHTML="Password must be at least 8 characters.";
    return false;

}

if(!/[A-Z]/.test(password)){

    error.innerHTML="Password must contain one uppercase letter.";
    return false;

}

if(!/[a-z]/.test(password)){

    error.innerHTML="Password must contain one lowercase letter.";
    return false;

}

if(!/[0-9]/.test(password)){

    error.innerHTML="Password must contain one number.";
    return false;

}

if(!/[!@#$%^&*(),.?":{}|<>]/.test(password)){

    error.innerHTML="Password must contain one special character.";
    return false;

}

if(password!==confirm){

    error.innerHTML="Passwords do not match.";
    return false;

}

return true;

}

</script>
</body>
</html>
