<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - AI NIDS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#1e293b;
    padding:35px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

h2{
    color: #fff;
    text-align: center;
    margin-bottom: 10px;
}

p{
    color:#cbd5e1;
    text-align:center;
    margin-bottom:25px;
    font-size:14px;
}

label{
    color:white;
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.radio-group{
    display:flex;
    gap:20px;
    margin-bottom:12px;
    color:white;
}

.radio-group label{
    font-weight:normal;
    display:flex;
    align-items:center;
    gap:6px;
}

input[type="text"], input[type="email"]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    margin-bottom:20px;
    background:#334155;
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#94a3b8;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#00c896;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00a77d;
}

.error{
    color:#ff6b6b;
    text-align:center;
    margin-bottom:15px;
}

.success{
    color:#22c55e;
    text-align:center;
    margin-bottom:15px;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#38bdf8;
    text-decoration:none;
}

.back a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <p>
        Enter your registered email or phone number.<br>
        We'll send you a One-Time Password (OTP).
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if error == 'Data not registered.' %}
        <script>
            window.alert('Data not registered.');
        </script>
    {% endif %}

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    <form method="POST">

        <div class="radio-group">
            <label>
                <input type="radio" name="recovery_type" value="email" {% if recovery_type != 'phone' %}checked{% endif %} onclick="updatePlaceholder('email')">
                Email
            </label>
            <label>
                <input type="radio" name="recovery_type" value="phone" {% if recovery_type == 'phone' %}checked{% endif %} onclick="updatePlaceholder('phone')">
                Phone Number
            </label>
        </div>

        <label id="field-label">Email Address</label>

        <input
            type="text"
            name="recovery_value"
            id="recovery_value"
            placeholder="Enter Registered Email"
            value="{{ recovery_value or '' }}"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <script>
        function updatePlaceholder(type) {
            let input = document.getElementById('recovery_value');
            let label = document.getElementById('field-label');
            if (type === 'phone') {
                input.placeholder = 'Enter Registered Phone Number';
                label.textContent = 'Phone Number';
                input.type = 'text';
            } else {
                input.placeholder = 'Enter Registered Email';
                label.textContent = 'Email Address';
                input.type = 'text';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const checked = document.querySelector('input[name="recovery_type"]:checked');
            updatePlaceholder(checked ? checked.value : 'email');
        });
    </script>

    <div class="back">
        <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>

</div>

</body>
</html>
