<!DOCTYPE html>
<html>
<head>
<title>NIDS</title>
<style>
body{background:#101820;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;}
.box{background:#162536;padding:35px;width:420px;border-radius:10px;color:white;}
input{width:100%;padding:12px;margin:12px 0;border-radius:6px;border:1px solid #2d4158;background:#0f172a;color:white;}
button{width:100%;padding:12px;background:#9c27b0;border:none;font-size:18px;cursor:pointer;color:white;border-radius:6px;}
.error{color:rgb(45, 101, 255);font-weight:bold;}.success{color:#00ff66;font-weight:bold;}
a{color:#00d4ff;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<h2>🔒 Change Password</h2>
<form method="POST">
<input type="password" name="current_password" placeholder="Current Password" required>
<input type="password" name="new_password" placeholder="New Password" required>
<input type="password" name="confirm_password" placeholder="Confirm New Password" required>
{% if error %}<p class="error">{{error}}</p>{% endif %}
{% if success %}<p class="success">{{success}}</p>{% endif %}
<a href="/forgot_password">Forgot Password?</a><br>
<button>Update Password</button>
<p style="margin-top:12px;"><a href="/settings">⬅ Back to Settings</a></p>
</form>
</div>
</body>
</html>
