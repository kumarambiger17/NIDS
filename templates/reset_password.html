<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - AI NIDS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#1e293b;
    padding:35px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

h2{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    text-align:center;
    margin-bottom:25px;
    font-size:14px;
    line-height:22px;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    font-size:15px;
    margin-bottom:20px;
    outline:none;
}

input::placeholder{
    color:#94a3b8;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#00c896;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00a77d;
}

.error{
    color:#ff6b6b;
    text-align:center;
    margin-bottom:15px;
}

.success{
    color:#22c55e;
    text-align:center;
    margin-bottom:15px;
}

.back{
    margin-top:20px;
    text-align:center;
}

.back a{
    color:#38bdf8;
    text-decoration:none;
}

.back a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Reset Password</h2>

<p>
Enter your new password below.
</p>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

{% if success %}
<div class="success">
{{ success }}
</div>
{% endif %}

<form method="POST">

<label>New Password</label>

<input
type="password"
name="new_password"
placeholder="Enter new password"
required
>

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm new password"
required
>

<button type="submit">
Reset Password
</button>

</form>

<div class="back">
<a href="{{ url_for('login') }}">
← Back to Login
</a>
</div>

</div>

</body>
</html>
