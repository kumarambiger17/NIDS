<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP - AI NIDS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#1e293b;
    padding:35px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

h2{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    text-align:center;
    margin-bottom:25px;
    font-size:14px;
    line-height:22px;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    font-size:18px;
    text-align:center;
    letter-spacing:4px;
    margin-bottom:20px;
    outline:none;
}

input::placeholder{
    letter-spacing:1px;
    color:#94a3b8;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#00c896;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00a77d;
}

.error{
    color:#0084ff;
    text-align:center;
    margin-bottom:15px;
}

.success{
    color:#22c55e;
    text-align:center;
    margin-bottom:15px;
}

.back{
    margin-top:20px;
    text-align:center;
}

.back a{
    color:#38bdf8;
    text-decoration:none;
}

.back a:hover{
    text-decoration:underline;
}

.note{
    margin-top:20px;
    color:#94a3b8;
    text-align:center;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h2>Verify OTP</h2>

<p>
An OTP has been sent to your registered email or Mobile Number.<br>
Enter the 6-digit OTP below.
</p>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

{% if success %}
<div class="success">
{{ success }}
</div>
{% endif %}

<form method="POST">

<label>Enter OTP</label>

<input
type="text"
name="otp"
maxlength="6"
pattern="[0-9]{6}"
inputmode="numeric"
placeholder="--OTP--"
required
>

<button type="submit">
Verify OTP
</button>
DID Not Recive The OTP?
<a href="{{ url_for('forgot_password') }}" style="color:#38bdf8;">
        Resend OTP
    </a>

</form>

<div class="note">
OTP expires in 5 minutes.
</div>

<div class="back">
<a href="{{ url_for('forgot_password') }}">
← Back
</a>
</div>

</div>

</body>
</html>
